packages:
  - "apps/*"
  - "packages/*"

# Versões das dependências usadas por mais de um app/pacote (no package.json: "catalog:").
catalog:
  "@better-auth/expo": "^1.6.23"
  "@prisma/adapter-pg": "7.7.0"
  "@prisma/client": "7.7.0"
  "@types/node": "^20"
  "@types/pg": "^8.20.0"
  better-auth: "^1.6.23"
  dotenv: "^17.4.2"
  eslint: "^9"
  pg: "^8.20.0"
  prisma: "7.7.0"
  tsx: "^4.21.0"
  typescript: "^5"
  typescript-eslint: "^8.59.0"
  vitest: "^5.0.2"
  zod: "^4.4.3"

allowBuilds:
  "@prisma/engines": false
  core-js-pure: false
  esbuild: false
  prisma: false
  puppeteer: true
  sharp: false
  unrs-resolver: false
ignoredBuiltDependencies:
  - sharp
  - unrs-resolver
onlyBuiltDependencies:
  - "@prisma/engines"
  - esbuild
  - prisma
