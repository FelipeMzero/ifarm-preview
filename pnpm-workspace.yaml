packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  "@prisma/engines": false
  core-js-pure: false
  esbuild: false
  prisma: false
  puppeteer: true
  sharp: false
  unrs-resolver: false
ignoredBuiltDependencies:
  - sharp
  - unrs-resolver
onlyBuiltDependencies:
  - "@prisma/engines"
  - esbuild
  - prisma
