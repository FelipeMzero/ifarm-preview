version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: container_postgres_ifarm
    restart: always
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: db_ifarm
    volumes:
      - pg_data_ifarm:/var/lib/postgresql/data

volumes:
  pg_data_ifarm: