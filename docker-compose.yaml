services:
  postgres:
    image: postgres:15
    container_name: container_postgres_ifarm
    restart: always
    ports:
      - '${DB_PORT}:5432'
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pg_data_ifarm:/var/lib/postgresql/data

volumes:
  pg_data_ifarm: